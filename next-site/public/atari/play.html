<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atari 2600 homebrew player</title>
  <style>
    :root { color-scheme: dark; font: 1rem/1.45 system-ui, sans-serif; background: #111; color: #fff; }
    body { margin: 0 auto; text-align: center; }
    p, footer { margin: .5rem; }
    a { color: #9edfff; }
    footer { font-size: .85rem; }
  </style>
</head>
<body>
  <main>
    <div id="javatari-screen"></div>
    <p id="guide" hidden></p>
    <p id="status" role="status">Loading cartridge&hellip;</p>
    <noscript>Enable JavaScript to play these cartridges.</noscript>
  </main>
  <footer>
    Emulator: <a href="https://javatari.org/" target="_blank" rel="noopener">Javatari 5.0.4</a> by Paulo Augusto Peccin
    (<a href="https://github.com/ppeccin/javatari.js/tree/f954960ddfbd8b8645de447bc7dc7a1eda066877" target="_blank" rel="noopener">source</a>,
    <a href="javatari/license.txt" target="_blank" rel="noopener">license</a>).
  </footer>
  <script src="javatari/javatari.js"></script>
  <script>
    const launcher = window.frameElement?.closest(".atari-arcade");
    if (launcher) {
      launcher.setAttribute("data-playing", "");
      window.addEventListener("pagehide", () => launcher.removeAttribute("data-playing"));
    }
    const games = new Map([
      ["super-step-bros", "Super Step Bros."],
      ["skateboard-steve", "The Adventures of Grumpy Gramps & Skateboard Steve"],
      ["simon-says", "Simon Says"],
      ["super-step-bros-revamped", "Super Step Bros.: Switchback Rescue (Revamped)"],
      ["skateboard-steve-revamped", "Skateboard Steve: Gramps' Backyard (Revamped)"],
      ["simon-says-revamped", "Simon Says: Echo (Revamped)"],
    ]);
    const id = new URLSearchParams(location.search).get("game");
    const statusLine = document.getElementById("status");
    if (typeof Javatari === "undefined") {
      statusLine.textContent = "The emulator could not load. Reload the page to try again.";
    } else {
      Javatari.AUTO_START = false;
      if (!games.has(id)) {
        statusLine.textContent = "Cartridge not found. Choose a game on the Atari homebrew article.";
      } else {
        document.title = games.get(id) + " | Atari 2600";
        const guides = {
          "super-step-bros-revamped": "Get Bo to the flag in three canyons. Climb east on Sunset Stair, cross the dip in Split Saddle, then head west on Westward Crown. Walk with Left/Right and jump with Up or fire (Space). Call Jo with Down, or have a partner steer with F/H and drop rocks with A. Hearts carry to the next canyon. After OUT, fire retries that canyon; Game Reset starts back at RIM 1.",
          "skateboard-steve-revamped": "Gramps wants Steve out of his backyard! Skate with Left/Right; hold fire (Space) to push faster. Dodge four throws to reach the next setting: apples by the picket fence, flowerpots in the greenhouse garden, then tennis balls beside the pool. The route loops with your score and hearts intact. A partner can move Gramps on the deck with F/H and throw with G or A. Three hits end the run; P1 fire or Game Reset starts over.",
          "simon-says-revamped": "Space starts solo; A starts a two-player duel. Watch the four pads and repeat their directions, releasing between notes. Solo grows to eight notes. In a duel, blue plays first (arrows), amber second (T/F/G/H); fewest mistakes wins, then fastest time. The result strip shows the winner's color, white for a tie or red for a solo miss. Game Reset returns to the lobby.",
        };
        if (guides[id]) {
          const guide = document.getElementById("guide");
          guide.textContent = guides[id];
          guide.hidden = false;
        }
        Javatari.ALLOW_URL_PARAMETERS = false;
        Javatari.CARTRIDGE_CHANGE_DISABLED = true;
        Javatari.CARTRIDGE_SHOW_RECENT = false;
        Javatari.SCREEN_FULLSCREEN_MODE = 0;
        Javatari.AUTO_POWER_ON_DELAY = 0;
        const newLevels = id === "super-step-bros-revamped" || id === "skateboard-steve-revamped";
        Javatari.CARTRIDGE_URL = "roms/" + id + ".bin" + (newLevels ? "?v=2.1.0" : "");
        Javatari.start();
        statusLine.textContent = (id === "simon-says" ? "Use Game Reset on the console to start. " : "")
          + "Click or tap the screen for controls. Player 1: arrow keys and Space. Player 2: T/F/G/H and A.";
      }
    }
  </script>
</body>
</html>
